version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:12"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "chore"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:24"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "chore"
      - "docker"
    groups:
      docker-packages:
        patterns:
          - "*"

  # Playwright and axe-core for the end-to-end tests (tests/e2e/). The
  # Playwright base image in tests/e2e/docker must move with @playwright/test,
  # so both are grouped and a bump of one shows up next to the other.
  - package-ecosystem: "npm"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "chore"
      - "e2e"
    groups:
      e2e-npm:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/tests/e2e/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "chore"
      - "e2e"
