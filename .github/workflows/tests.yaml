name: Test
on:
  pull_request:
    branches: [ main, dev ]

jobs:
  tests:
    name: Run Lua Firewall Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 #v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc #v6.5.0
        with:
          context: .
          file: nginx.local.dockerfile
          target: test
          load: true
          tags: test-firewall
          cache-from: type=gha,scope=lua-test
          cache-to: type=gha,mode=max,scope=lua-test

      - name: Run tests
        run: |
          docker run --rm \
            --network host \
            -e REDIS_HOST=localhost \
            -e FIREWALL_DB=1 \
            test-firewall

  # Every environment gets its config from values.yaml layered with its own
  # values-<env>.yaml overlay, so there are four ways the chart can render and
  # a PR only exercises them here. Without this, a template referencing a value
  # no overlay defines, or a renamed overlay file, is first discovered by the
  # deploy job - mid-deploy, against a live namespace.
  #
  # Needs no secrets and no cluster: the chart renders with empty image
  # repositories, and the deploy-time --set flags do not change which code
  # paths run.
  helm-render:
    name: Render Helm chart for every environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 #v5.0.1

      - name: Render and lint each environment
        run: |
          for env in dev demo staging prod; do
            echo "::group::$env"
            helm template wordpress helm_deploy/wordpress \
              --values helm_deploy/wordpress/values.yaml \
              --values helm_deploy/wordpress/values-"$env".yaml > /dev/null
            helm lint helm_deploy/wordpress \
              --values helm_deploy/wordpress/values.yaml \
              --values helm_deploy/wordpress/values-"$env".yaml
            echo "::endgroup::"
          done

  # Two numbers - the WordPress core version and the PHP version - are declared
  # independently in four files, and nothing links them at build time. A
  # mismatch is quiet: local tests a different PHP than production runs, or the
  # wptools sidecar bootstraps WordPress on an older interpreter than the site
  # does. Needs no secrets, no cluster and no images.
  versions:
    name: Version references agree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Check versions
        run: ./bin/check-versions.sh
