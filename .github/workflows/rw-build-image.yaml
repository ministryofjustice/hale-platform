name: Build and Deploy WordPress

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      ecr-role:
        required: true
      ecr-region:
        required: true
      ecr-repo:
        required: true
      sentry-dsn:
        required: true
      acf-user:
        required: true
      acf-password:
        required: true
      acf-token:
        required: true
      relevanssi-user:
        required: true
      relevanssi-password:
        required: true
      kube-cluster:
        required: true
      kube-cert:
        required: true
      kube-namespace:
        required: true
      kube-token:
        required: true
      wp-db-user:
        required: true
      wp-db-host:
        required: true
      wp-db-name:
        required: true
      wp-db-password:
        required: true
      wp-admin-email:
        required: true
      wp-admin-user:
        required: true
      wp-admin-password:
        required: true
      wp-auth-key-file:
        required: true
      wp-auth-salt-file:
        required: true
      wp-loggedin-key-file:
        required: true
      wp-loggedin-salt-file:
        required: true
      wp-nonce-key-file:
        required: true
      wp-nonce-salt-file:
        required: true
      wp-secure-auth-key-file:
        required: true
      wp-secure-auth-salt-file:
        required: true
      s3-uploads-bucket:
        required: true
      s3-uploads-region:
        required: true
      s3-uploads-bucket-url:
        required: true
      s3-uploads-object-acl:
        required: true
      cloudfront-distribution-id:
        required: true
      alert-slack-webhook-url:
        required: true
      wb-config:
        required: true
      auth0-env-client-id:
        required: true
      auth0-env-client-secret:
        required: true
      auth0-env-domain:
        required: true
      redis-auth:
        required: true
      redis-host:
        required: true

jobs:
  buildImage:
    name: Build Image and push to ECR
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Config Credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.ecr-role }}
          aws-region: ${{ secrets.ecr-region }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        id: login-ecr
        with:
          mask-password: "true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Cache Docker layers for Nginx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache-nginx
          key: ${{ runner.os }}-buildx-nginx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-nginx-

      - name: Build and Push Nginx Image
        run: |
          docker buildx create --use
          docker buildx build \
            --cache-from=type=local,src=/tmp/.buildx-cache-nginx \
            --cache-to=type=local,dest=/tmp/.buildx-cache-nginx \
            --pull \
            --push \
            --tag $REGISTRY/$REPOSITORY:hale-platform_nginx-$IMAGE_TAG \
            --file nginx.dockerfile .
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ecr-repo }}
          IMAGE_TAG: ${{ github.sha }}

      - name: Prepare Composer cache
        run: mkdir -p ~/.composer/cache

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Set PHP min version
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: 8.5

      - name: Run Composer and generate vendor packages
        run: |
          if ! composer config --global --list | grep -q 'github.com'; then
            composer config --global http-basic.github.com x-access-token ${{ secrets.GITHUB_TOKEN }}
          fi
          composer config --global http-basic.connect.advancedcustomfields.com ${{ secrets.acf-user }} ${{ secrets.acf-password }}
          composer config --global http-basic.relevanssi.com ${{ secrets.relevanssi-user }} ${{ secrets.relevanssi-password }}
          composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Cache NPM Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            wordpress/wp-content/themes/govwind/node_modules
            wordpress/wp-content/themes/hale/node_modules
            wordpress/wp-content/themes/hale-dash/node_modules
            wordpress/wp-content/themes/hale-showcase/node_modules
            wordpress/wp-content/themes/ppo/node_modules
            wordpress/wp-content/themes/justice/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run NPM (parallel builds)
        run: |
          for theme in hale hale-dash hale-showcase ppo govwind justice; do
            (
              cd ./wordpress/wp-content/themes/$theme
              if [ -f package-lock.json ]; then
                npm ci --prefer-offline --no-audit
              else
                npm install --prefer-offline --no-audit
              fi
              npm run production --if-present
            ) &
          done
          wait

      - name: Cache Docker layers for WordPress
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache-wordpress
          key: ${{ runner.os }}-buildx-wordpress-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-wordpress-

      - name: Build and Push WordPress Image
        run: |
          docker buildx create --use
          docker buildx build \
            --cache-from=type=local,src=/tmp/.buildx-cache-wordpress \
            --cache-to=type=local,dest=/tmp/.buildx-cache-wordpress \
            --pull \
            --push \
            --tag $REGISTRY/$REPOSITORY:hale-platform_wordpress-$IMAGE_TAG \
            --file wordpress.dockerfile .
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ecr-repo }}
          IMAGE_TAG: ${{ github.sha }}

      # Database tooling sidecar. The hardened WordPress image has no mysql
      # client, so `wp db` subcommands run in this container instead.
      - name: Build and Push wptools Image
        run: |
          docker buildx build \
            --pull \
            --push \
            --platform linux/amd64 \
            --tag $REGISTRY/$REPOSITORY:hale-platform_wptools-$IMAGE_TAG \
            --file wptools.dockerfile .
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ecr-repo }}
          IMAGE_TAG: ${{ github.sha }}

      # The wordpress and wptools images are built independently, from different
      # bases, each with its own PHP. bin/check-versions.sh asserts the versions
      # *declared* in the repo agree; this asserts the versions actually built do,
      # and that the sidecar can still bootstrap WordPress.
      #
      # It catches three things nothing else does:
      #   - the two PHPs drifting apart despite matching ARGs
      #   - a distro renaming or dropping a package, so an extension the site
      #     loads quietly disappears from the sidecar and every `wp` command
      #     starts failing at bootstrap
      #   - redis.so failing to load in the wordpress image, which is silent:
      #     php-fpm logs a startup warning and serves on without it, and
      #     /healthz does not check extensions
      - name: Verify the images agree
        run: |
          set -euo pipefail
          WP="$REGISTRY/$REPOSITORY:hale-platform_wordpress-$IMAGE_TAG"
          WT="$REGISTRY/$REPOSITORY:hale-platform_wptools-$IMAGE_TAG"
          docker pull -q "$WP" >/dev/null
          docker pull -q "$WT" >/dev/null

          php_of() { docker run --rm --entrypoint php "$1" -r 'echo PHP_VERSION;'; }
          wp_php="$(php_of "$WP")"
          wt_php="$(php_of "$WT")"
          echo "wordpress PHP $wp_php"
          echo "wptools   PHP $wt_php"

          if [ "${wp_php%.*}" != "${wt_php%.*}" ]; then
            echo "::error::PHP minor version mismatch - wordpress $wp_php, wptools $wt_php"
            exit 1
          fi
          if [ "$wp_php" != "$wt_php" ]; then
            echo "::warning::PHP patch versions differ - wordpress $wp_php, wptools $wt_php"
          fi

          # wp-cli bootstraps WordPress, so the sidecar needs what the site loads.
          for e in mysqli pdo_mysql phar mbstring xml dom simplexml curl openssl \
                   session fileinfo tokenizer ctype iconv posix redis; do
            if ! docker run --rm --entrypoint php "$WT" -r "exit(extension_loaded('$e') ? 0 : 1);"; then
              echo "::error::wptools is missing the $e extension"
              exit 1
            fi
          done

          if ! docker run --rm --entrypoint php "$WP" -r "exit(extension_loaded('redis') ? 0 : 1);"; then
            echo "::error::redis.so did not load in the wordpress image - check the ABI it was built against"
            exit 1
          fi

          # PDF uploads. ImageMagick has no PDF decoder of its own, so a media
          # library thumbnail for a PDF is a fork of /usr/bin/gs. Ghostscript is
          # staged out of the builder rather than installed, and the -dev variant
          # carries libraries the runtime does not - so this writes a PDF and
          # reads it back in the runtime image, which is the only place the
          # dependency is actually resolved. A missing gs surfaces here as
          # "FailedToExecuteCommand" rather than as a 500 on first upload.
          if ! docker run --rm --tmpfs /tmp:rw,mode=1777 --entrypoint php "$WP" -r '$i=new Imagick(); $i->newImage(8,8,"white"); $i->setImageFormat("pdf"); $i->writeImage("/tmp/probe.pdf"); $j=new Imagick(); $j->readImage("/tmp/probe.pdf[0]"); exit($j->getImageWidth() > 0 ? 0 : 1);'; then
            echo "::error::the wordpress image cannot rasterise a PDF - check that ghostscript was staged into the runtime stage"
            exit 1
          fi

          echo "images agree: PHP ${wp_php%.*}, all required extensions present"
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ecr-repo }}
          IMAGE_TAG: ${{ github.sha }}
  deployImage:
    name: Deploy to Environment
    needs: [buildImage]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to the cluster
        env:
          KUBE_CLUSTER: ${{ secrets.kube-cluster }}
        run: |
          echo "${{ secrets.kube-cert }}" > ca.crt
          kubectl config set-cluster ${KUBE_CLUSTER} --certificate-authority=./ca.crt --server=https://${KUBE_CLUSTER}
          kubectl config set-credentials deploy-user --token=${{ secrets.kube-token }}
          kubectl config set-context ${KUBE_CLUSTER} --cluster=${KUBE_CLUSTER} --user=deploy-user --namespace=${{ secrets.kube-namespace }}
          kubectl config use-context ${KUBE_CLUSTER}

      - name: Apply Helm chart
        run: |
          helm upgrade wordpress helm_deploy/wordpress \
          --install \
          --namespace ${{ secrets.kube-namespace }} \
          --values helm_deploy/wordpress/values.yaml \
          --values helm_deploy/wordpress/values-${{ vars.ENV_TYPE }}.yaml \
          --set secrets.wpdbuser=${{ secrets.wp-db-user }} \
          --set secrets.wpdbhost=${{ secrets.wp-db-host }} \
          --set secrets.wpdbname=${{ secrets.wp-db-name }} \
          --set secrets.wpdbpassword=${{ secrets.wp-db-password }} \
          --set secrets.wpadminemail=${{ secrets.wp-admin-email }} \
          --set secrets.wpadminuser=${{ secrets.wp-admin-user }} \
          --set secrets.wpadminpassword=${{ secrets.wp-admin-password }} \
          --set secrets.wpauthkey=${{ secrets.wp-auth-key-file }} \
          --set secrets.wpauthsalt=${{ secrets.wp-auth-salt-file }} \
          --set secrets.wploggedinkey=${{ secrets.wp-loggedin-key-file }} \
          --set secrets.wploggedinsalt=${{ secrets.wp-loggedin-salt-file }} \
          --set secrets.wpnoncekey=${{ secrets.wp-nonce-key-file }} \
          --set secrets.wpnoncesalt=${{ secrets.wp-nonce-salt-file }} \
          --set secrets.wpsecureauthkey=${{ secrets.wp-secure-auth-key-file }} \
          --set secrets.wpsecureauthsalt=${{ secrets.wp-secure-auth-salt-file }} \
          --set secrets.s3uploadsbucket=${{ secrets.s3-uploads-bucket }} \
          --set secrets.s3uploadsregion=${{ secrets.s3-uploads-region }} \
          --set secrets.s3uploadsbucketurl=${{ secrets.s3-uploads-bucket-url }} \
          --set secrets.s3uploadsobjectacl=${{ secrets.s3-uploads-object-acl }} \
          --set secrets.cloudfrontdistributionid=${{ secrets.cloudfront-distribution-id }} \
          --set secrets.wbconfig=${{ secrets.wb-config }} \
          --set secrets.auth0envclientid=${{ secrets.auth0-env-client-id }} \
          --set secrets.auth0envclientsecret=${{ secrets.auth0-env-client-secret }} \
          --set secrets.auth0envdomain=${{ secrets.auth0-env-domain }} \
          --set secrets.acftoken=${{ secrets.acf-token }} \
          --set secrets.redisauth=${{ secrets.redis-auth }} \
          --set secrets.redishost=${{ secrets.redis-host }} \
          --set alertSecrets.slackWebhookUrl=${{ secrets.alert-slack-webhook-url }} \
          --set configmap.sentrydns=${{ vars.PHP_DSN }} \
          --set ingress.metadata.annotations.setidentifier=hale-platform-ingress-${{ secrets.kube-namespace }}-green \
          --set nginx.image.repository=754256621582.dkr.ecr.eu-west-2.amazonaws.com/${{ secrets.ecr-repo }}:hale-platform_nginx-${{ github.sha }} \
          --set wp.image.repository=754256621582.dkr.ecr.eu-west-2.amazonaws.com/${{ secrets.ecr-repo }}:hale-platform_wordpress-${{ github.sha }} \
          --set wptools.image.repository=754256621582.dkr.ecr.eu-west-2.amazonaws.com/${{ secrets.ecr-repo }}:hale-platform_wptools-${{ github.sha }}

      # helm upgrade returns as soon as the API server accepts the manifests -
      # seconds, before a single new pod exists. Without this the job goes green
      # whether or not the rollout ever completes, and maxUnavailable: 0 makes
      # that quiet rather than loud: the old pods keep serving, so a stalled
      # deploy looks exactly like a successful one.
      #
      # This changes no deployment behaviour, it only waits and reports. It
      # returns the moment the rollout finishes - roughly 2-3 minutes in dev and
      # 4-5 in prod - and the timeout is a ceiling for something genuinely stuck,
      # at which point the Deployment's own progressDeadlineSeconds has already
      # marked it ProgressDeadlineExceeded.
      #
      # No rollback: a red build here means "the new version is not serving",
      # not "the site is down". The old pods are still up, and whether to roll
      # back is a decision for a person.
      - name: Wait for the rollout
        run: |
          kubectl rollout status deploy/wordpress \
            --namespace ${{ secrets.kube-namespace }} \
            --timeout=10m

      # Readiness deliberately stops before WordPress renders anything - no
      # plugins, no theme, no database - so every other check in this pipeline
      # can pass while every page returns 500. This is the only test that
      # exercises the path a visitor actually takes: ingress, TLS, nginx,
      # FastCGI, php-fpm, WordPress, database, HTML.
      #
      # The host comes from the ingress so it is correct per environment with no
      # extra inputs to keep in step.
      #
      # The cache-busting query string is load-bearing. A plain request can be
      # served from the Redis page cache by nginx alone, with php-fpm completely
      # dead, and would pass. A query string bypasses the cache and forces the
      # request through PHP.
      - name: Smoke test the deployed site
        run: |
          set -euo pipefail
          host=$(kubectl get ingress hale-platform-ingress \
            --namespace ${{ secrets.kube-namespace }} \
            -o jsonpath='{.spec.rules[0].host}')
          if [ -z "$host" ]; then
            echo "::error::could not read a host from the ingress"
            exit 1
          fi
          url="https://$host/?deploy-smoke-test=${{ github.sha }}"
          echo "requesting $url"
          code=$(curl -sS -o /tmp/smoke.html -w '%{http_code}' --max-time 30 "$url" || echo 000)
          bytes=$(wc -c < /tmp/smoke.html | tr -d ' ')
          echo "HTTP $code, $bytes bytes"
          if [ "$code" != "200" ]; then
            echo "::error::$host returned $code after deploy"
            head -c 500 /tmp/smoke.html
            exit 1
          fi
          echo "site is serving"

