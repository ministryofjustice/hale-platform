name: Build and Deploy WordPress

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      # How much page cache to clear after the deploy. Resolved in cd.yaml
      # from the merged PR's labels: all | hale | govwind | none.
      pagecache-purge:
        required: false
        type: string
        default: all
    secrets:
      ecr-role:
        required: true
      ecr-region:
        required: true
      ecr-repo:
        required: true
      sentry-dsn: 
        required: true
      domain:
        required: true
      env-type:
        required: true
      acf-user:
        required: true
      acf-password:
        required: true
      acf-token:
        required: true
      relevanssi-user:
        required: true
      relevanssi-password:
        required: true
      kube-cluster:
        required: true
      kube-cert:
        required: true
      kube-namespace:
        required: true
      kube-token:
        required: true
      wp-db-user:
        required: true
      wp-db-host:
        required: true
      wp-db-name:
        required: true
      wp-db-password:
        required: true
      wp-admin-email:
        required: true
      wp-admin-user:
        required: true
      wp-admin-password:
        required: true
      wp-auth-key-file:
        required: true
      wp-auth-salt-file:
        required: true
      wp-loggedin-key-file:
        required: true
      wp-loggedin-salt-file:
        required: true
      wp-nonce-key-file:
        required: true
      wp-nonce-salt-file:
        required: true
      wp-secure-auth-key-file:
        required: true
      wp-secure-auth-salt-file:
        required: true
      s3-uploads-bucket:
        required: true
      s3-uploads-region:
        required: true
      s3-uploads-bucket-url:
        required: true
      s3-uploads-object-acl:
        required: true
      cloudfront-distribution-id:
        required: true
      alert-slack-webhook-url:
        required: true
      wb-config:
        required: true
      auth0-env-client-id:
        required: true
      auth0-env-client-secret:
        required: true
      auth0-env-domain:
        required: true
      redis-auth:
        required: true
      redis-host:
        required: true

jobs:
  buildImage:
    name: Build Image and push to ECR
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Config Credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.ecr-role }}
          aws-region: ${{ secrets.ecr-region }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2.1.5
        id: login-ecr
        with:
          mask-password: "true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Cache Docker layers for Nginx
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/.buildx-cache-nginx
          key: ${{ runner.os }}-buildx-nginx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-nginx-

      - name: Build and Push Nginx Image
        run: |
          docker buildx create --use
          docker buildx build \
            --cache-from=type=local,src=/tmp/.buildx-cache-nginx \
            --cache-to=type=local,dest=/tmp/.buildx-cache-nginx \
            --pull \
            --push \
            --tag $REGISTRY/$REPOSITORY:hale-platform_nginx-$IMAGE_TAG \
            --file nginx.dockerfile .
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ecr-repo }}
          IMAGE_TAG: ${{ github.sha }}

      - name: Prepare Composer cache
        run: mkdir -p ~/.composer/cache

      - name: Cache Composer packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Set PHP min version
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: 8.4

      - name: Run Composer and generate vendor packages
        run: |
          if ! composer config --global --list | grep -q 'github.com'; then
            composer config --global http-basic.github.com x-access-token ${{ secrets.GITHUB_TOKEN }}
          fi
          composer config --global http-basic.connect.advancedcustomfields.com ${{ secrets.acf-user }} ${{ secrets.acf-password }}
          composer config --global http-basic.relevanssi.com ${{ secrets.relevanssi-user }} ${{ secrets.relevanssi-password }}
          composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Cache NPM Dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.npm
            wordpress/wp-content/themes/govwind/node_modules
            wordpress/wp-content/themes/hale/node_modules
            wordpress/wp-content/themes/hale-dash/node_modules
            wordpress/wp-content/themes/hale-showcase/node_modules
            wordpress/wp-content/themes/ppo/node_modules
            wordpress/wp-content/themes/justice/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run NPM (parallel builds)
        run: |
          for theme in hale hale-dash hale-showcase ppo govwind justice; do
            (
              cd ./wordpress/wp-content/themes/$theme
              if [ -f package-lock.json ]; then
                npm ci --prefer-offline --no-audit
              else
                npm install --prefer-offline --no-audit
              fi
              npm run production --if-present
            ) &
          done
          wait

      - name: Cache Docker layers for WordPress
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: /tmp/.buildx-cache-wordpress
          key: ${{ runner.os }}-buildx-wordpress-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-wordpress-

      - name: Build and Push WordPress Image
        run: |
          docker buildx create --use
          docker buildx build \
            --cache-from=type=local,src=/tmp/.buildx-cache-wordpress \
            --cache-to=type=local,dest=/tmp/.buildx-cache-wordpress \
            --pull \
            --push \
            --tag $REGISTRY/$REPOSITORY:hale-platform_wordpress-$IMAGE_TAG \
            --file wordpress.dockerfile .
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ecr-repo }}
          IMAGE_TAG: ${{ github.sha }}

  deployImage:
    name: Deploy to Environment
    needs: [buildImage]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Authenticate to the cluster
        env:
          KUBE_CLUSTER: ${{ secrets.kube-cluster }}
        run: |
          echo "${{ secrets.kube-cert }}" > ca.crt
          kubectl config set-cluster ${KUBE_CLUSTER} --certificate-authority=./ca.crt --server=https://${KUBE_CLUSTER}
          kubectl config set-credentials deploy-user --token=${{ secrets.kube-token }}
          kubectl config set-context ${KUBE_CLUSTER} --cluster=${KUBE_CLUSTER} --user=deploy-user --namespace=${{ secrets.kube-namespace }}
          kubectl config use-context ${KUBE_CLUSTER}

      - name: Apply Helm chart
        run: |
          helm upgrade wordpress helm_deploy/wordpress \
          --install \
          --namespace ${{ secrets.kube-namespace }} \
          --values helm_deploy/wordpress/values.yaml \
          --set secrets.wpdbuser=${{ secrets.wp-db-user }} \
          --set secrets.wpdbhost=${{ secrets.wp-db-host }} \
          --set secrets.wpdbname=${{ secrets.wp-db-name }} \
          --set secrets.wpdbpassword=${{ secrets.wp-db-password }} \
          --set secrets.wpadminemail=${{ secrets.wp-admin-email }} \
          --set secrets.wpadminuser=${{ secrets.wp-admin-user }} \
          --set secrets.wpadminpassword=${{ secrets.wp-admin-password }} \
          --set secrets.wpauthkey=${{ secrets.wp-auth-key-file }} \
          --set secrets.wpauthsalt=${{ secrets.wp-auth-salt-file }} \
          --set secrets.wploggedinkey=${{ secrets.wp-loggedin-key-file }} \
          --set secrets.wploggedinsalt=${{ secrets.wp-loggedin-salt-file }} \
          --set secrets.wpnoncekey=${{ secrets.wp-nonce-key-file }} \
          --set secrets.wpnoncesalt=${{ secrets.wp-nonce-salt-file }} \
          --set secrets.wpsecureauthkey=${{ secrets.wp-secure-auth-key-file }} \
          --set secrets.wpsecureauthsalt=${{ secrets.wp-secure-auth-salt-file }} \
          --set secrets.s3uploadsbucket=${{ secrets.s3-uploads-bucket }} \
          --set secrets.s3uploadsregion=${{ secrets.s3-uploads-region }} \
          --set secrets.s3uploadsbucketurl=${{ secrets.s3-uploads-bucket-url }} \
          --set secrets.s3uploadsobjectacl=${{ secrets.s3-uploads-object-acl }} \
          --set secrets.cloudfrontdistributionid=${{ secrets.cloudfront-distribution-id }} \
          --set secrets.wbconfig=${{ secrets.wb-config }} \
          --set secrets.auth0envclientid=${{ secrets.auth0-env-client-id }} \
          --set secrets.auth0envclientsecret=${{ secrets.auth0-env-client-secret }} \
          --set secrets.auth0envdomain=${{ secrets.auth0-env-domain }} \
          --set secrets.acftoken=${{ secrets.acf-token }} \
          --set secrets.redisauth=${{ secrets.redis-auth }} \
          --set secrets.redishost=${{ secrets.redis-host }} \
          --set alertSecrets.slackWebhookUrl=${{ secrets.alert-slack-webhook-url }} \
          --set configmap.envtype=${{ vars.ENV_TYPE }} \
          --set configmap.sentrydns=${{ vars.PHP_DSN }} \
          --set ingress.metadata.annotations.setidentifier=hale-platform-ingress-${{ secrets.kube-namespace }}-green \
          --set domain=${{ secrets.domain }} \
          --set nginx.image.repository=754256621582.dkr.ecr.eu-west-2.amazonaws.com/${{ secrets.ecr-repo }}:hale-platform_nginx-${{ github.sha }} \
          --set wp.image.repository=754256621582.dkr.ecr.eu-west-2.amazonaws.com/${{ secrets.ecr-repo }}:hale-platform_wordpress-${{ github.sha }}

      # The helm upgrade above has no --wait, so it returns as soon as the API
      # server accepts the manifests - potentially with every pod still running
      # the old image. Block until the rollout is genuinely done, otherwise an
      # old pod can re-cache stale HTML immediately after the purge below.
      - name: Wait for rollout to complete
        if: inputs.pagecache-purge != 'none'
        run: |
          kubectl rollout status deployment/wordpress \
            --namespace ${{ secrets.kube-namespace }} \
            --timeout=10m

      # Cached HTML references versioned asset URLs (?id=<hash>, from Laravel
      # Mix). Mix versions by query string, not filename, so those URLs resolve
      # to the NEWLY deployed CSS/JS - stale markup gets paired with new assets
      # until the entry expires. Clearing here closes that window.
      - name: Clear the full-page cache
        if: inputs.pagecache-purge != 'none'
        env:
          SCOPE: ${{ inputs.pagecache-purge }}
          NAMESPACE: ${{ secrets.kube-namespace }}
        run: |
          set -euo pipefail

          case "$SCOPE" in
            all)     WP_ARGS="purge-all" ;;
            hale)    WP_ARGS="purge-theme hale" ;;
            govwind) WP_ARGS="purge-theme govwind" ;;
            *)       echo "::error::Unknown purge scope '$SCOPE'"; exit 1 ;;
          esac

          POD=$(kubectl get pods \
            --namespace "$NAMESPACE" \
            --selector app=wordpress,tier=frontend-c \
            --field-selector status.phase=Running \
            -o jsonpath='{.items[0].metadata.name}')

          if [ -z "$POD" ]; then
            echo "::error::No running wordpress pod found; cache not cleared."
            exit 1
          fi

          # "wp pagecache" ships in hale-components. If this image predates it,
          # warn rather than fail: the deploy itself already succeeded, and a
          # missed purge is bounded by PAGECACHE_TTL (300s). Failing here would
          # red-flag a good deploy - and on Staging it would block deployProd,
          # which needs: deployStaging.
          if ! kubectl exec --namespace "$NAMESPACE" "$POD" \
                 --container wordpress -- wp cli has-command pagecache; then
            echo "::warning::'wp pagecache' is not available in this image; cache not cleared. Stale pages will expire within PAGECACHE_TTL."
            exit 0
          fi

          echo "Clearing page cache (scope: $SCOPE) via pod $POD"
          kubectl exec --namespace "$NAMESPACE" "$POD" \
            --container wordpress -- wp pagecache $WP_ARGS
          echo "### Page cache cleared: \`$SCOPE\`" >> "$GITHUB_STEP_SUMMARY"
