# Disposable multisite for the Playwright end-to-end tests (tests/e2e/).
#
# A separate compose project from hale.docker: its own containers, network,
# volumes, port and database, so the two can run side by side and a test run
# can never touch a developer's local content. tests/e2e/stack/stack.sh
# starts it, seeds it, runs the playwright service against it and removes it
# again with `down -v`; see tests/e2e/README.md. The images are built by
# tests/e2e/stack/build.sh, not by compose, so the test stack runs the code
# the image holds rather than anything bind-mounted from ./wordpress or ./dev.
#
#   docker compose -f docker-compose.test.yml ps
#   docker compose -f docker-compose.test.yml logs -f wordpress
#   docker compose -f docker-compose.test.yml down -v --remove-orphans

# Fixed project name, so `down -v` always finds what a crashed run left behind
# and nothing here can collide with the hale-platform project.
name: ${HALE_TEST_PROJECT:-hale-test}

# WordPress environment, shared by the wordpress container and the seed job.
# Mirrors docker-compose.yml's x-wp-env, with test-only credentials and the
# firewall and page cache off: tests hit WordPress through the same nginx
# config, without a cache that could serve one test another test's page.
x-wp-env: &wp-env
  WORDPRESS_DB_HOST: mariadb:3306
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: wordpress
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_ADMIN_USER: e2eadmin
  WORDPRESS_ADMIN_PASSWORD: ${E2E_PASSWORD:-hale-e2e-test-only}
  WORDPRESS_ADMIN_EMAIL: "e2eadmin@example.test"
  # local keeps the S3 uploads plugin out (opt/php/load.php) so media stays
  # on disk.
  WP_ENVIRONMENT_TYPE: local
  S3_UPLOADS_USE_LOCAL: "true"
  S3_UPLOADS_USE_INSTANCE_PROFILE: "false"
  S3_UPLOADS_REGION: ""
  S3_UPLOADS_BUCKET: ""
  S3_UPLOADS_BUCKET_URL: ""
  S3_UPLOADS_OBJECT_ACL: ""
  CLOUDFRONT_DISTRIBUTION_ID: ""
  AUTH0_ENV_CLIENT_ID: ""
  AUTH0_ENV_CLIENT_SECRET: ""
  AUTH0_ENV_DOMAIN: ""
  # The network's domain, port included. Multisite only strips :80 and :443
  # from the Host header, so the port is part of every site's stored domain.
  SERVER_NAME: "localhost:${HALE_TEST_PORT:-8443}"
  PHP_DSN: ""
  WP_SENTRY_ENV: ""
  ACF_PRO_LICENSE: ""
  NGINX_INTERNAL_URL: "https://nginx"
  FIREWALL_ENABLED: "false"
  PAGECACHE_ENABLED: "false"
  REDIS_SSL: "false"

services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    # In memory: faster than a volume, and gone the moment the container is.
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60

  # Same job as wpcore-init in docker-compose.yml: the hardened image runs as
  # 65532 and cannot write to a freshly created, root-owned volume.
  wpcore-init:
    image: alpine:3.24
    user: "0:0"
    command: ["sh", "-c", "chown 65532:65532 /var/www/html && chmod 755 /var/www/html"]
    volumes:
      - wpcore:/var/www/html

  wordpress:
    image: hale-test/wordpress
    pull_policy: never
    depends_on:
      mariadb:
        condition: service_healthy
      wpcore-init:
        condition: service_completed_successfully
    volumes:
      - wpcore:/var/www/html
    environment:
      <<: *wp-env
    # config.sh installs the network before php-fpm starts, so a listening
    # php-fpm means WordPress is installed. The start period covers copying
    # core into the volume on first start.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 120s

  nginx:
    image: hale-test/nginx
    pull_policy: never
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      # Loopback only, and not 443 or 8080, so hale.docker keeps its ports.
      - "127.0.0.1:${HALE_TEST_PORT:-8443}:443"
    volumes:
      - wpcore:/var/www/html
      # Self-signed localhost certificate, generated by tests/e2e/stack/stack.sh
      # under the file names opt/nginx/localwordpress.conf expects.
      - ./tests/e2e/.stack/certs:/etc/nginx/certs/self-signed:ro
    networks:
      - default
      - e2e
    environment:
      FIREWALL_ENABLED: "false"
      PAGECACHE_ENABLED: "false"
      REDIS_SSL: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot job: creates the sites, users and settings and loads the content
  # fixtures, then exits. Behind a profile so `up` never starts it;
  # tests/e2e/stack/stack.sh runs it with `run --rm seed`. Uses the wptools
  # image because it has the mysql client that `wp db` needs and the hardened
  # image does not.
  seed:
    image: hale-test/wptools
    pull_policy: never
    profiles: ["seed"]
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - wpcore:/var/www/html
      - ./tests/e2e/seed:/seed:ro
      - ./opt/mariadb/client-local.cnf:/etc/my.cnf.d/client-local.cnf:ro
    environment:
      <<: *wp-env
      E2E_PASSWORD: ${E2E_PASSWORD:-hale-e2e-test-only}
    command: ["sh", "/seed/seed.sh"]

  # The Playwright tests. Node, Chromium and the npm packages live only in
  # this image (tests/e2e/docker/playwright.dockerfile), never on the host, and
  # the container gets as little as the tests need:
  # - the e2e network only, which has no route out: nginx is the one thing it
  #   can reach
  # - tests/e2e read-only, so nothing in it can change code the host later
  #   runs (stack.sh, build.sh, the seed); writable mounts for its output only.
  #   Playwright deletes and recreates its results and report folders, which
  #   it cannot do to a mount point, so both live inside the output mount.
  # - no Docker socket, no capabilities, a read-only root filesystem
  # stack.sh runs it with `run --rm playwright <playwright arguments>` once the
  # stack is up and seeded.
  playwright:
    image: hale-test/playwright
    pull_policy: never
    profiles: ["playwright"]
    # pwuser from the image; stack.sh sets the host user on Linux so the
    # report and traces it writes belong to whoever ran the tests.
    user: "${E2E_USER:-pwuser}"
    working_dir: /hale/tests/e2e
    entrypoint: ["sh", "/hale/tests/e2e/docker/entrypoint.sh"]
    command: ["test"]
    init: true
    read_only: true
    tmpfs:
      - /tmp
    # Chromium keeps shared memory in /dev/shm; Docker's 64MB default makes it
    # crash on larger pages.
    shm_size: 1gb
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./tests/e2e:/hale/tests/e2e:ro
      - ./tests/e2e/.auth:/hale/tests/e2e/.auth
      - ./tests/e2e/output:/hale/tests/e2e/output
    environment:
      HOME: /tmp
      CI: ${CI:-}
      HALE_TEST_PROJECT: ${HALE_TEST_PROJECT:-hale-test}
      HALE_TEST_PORT: ${HALE_TEST_PORT:-8443}
      E2E_UI_PORT: ${E2E_UI_PORT:-9323}
      E2E_PASSWORD: ${E2E_PASSWORD:-hale-e2e-test-only}
      E2E_STACK_RUNNING: ${E2E_STACK_RUNNING:-}
      # Set by stack.sh when the host has a terminal: tests run without a TTY
      # so the HTML reporter does not print an `npx playwright show-report`
      # hint, which would install and run Playwright on the host.
      FORCE_COLOR:
      # The repo's layout is kept under /hale, so on GitHub Actions the
      # github reporter's annotations point at tests/e2e/... in the repo.
      GITHUB_ACTIONS: ${GITHUB_ACTIONS:-}
      GITHUB_WORKSPACE: ${GITHUB_ACTIONS:+/hale}
    networks:
      - e2e

  # The same container with a port on the host, for Playwright UI mode and the
  # HTML report (make test-e2e-ui, make test-e2e-report). An internal network
  # cannot publish a port, so this one is also on the default network and,
  # unlike the playwright service, can reach the internet.
  playwright-ui:
    extends:
      service: playwright
    profiles: ["playwright-ui"]
    ports:
      - "127.0.0.1:${E2E_UI_PORT:-9323}:9323"
    networks:
      - default
      - e2e

  # The same tests on BrowserStack devices (make test-e2e-browserstack).
  # browserstack-node-sdk runs Playwright here and opens a BrowserStack Local
  # tunnel, through which the remote browsers reach https://localhost:8443/,
  # served in this container by forward.js. Separate image, so the SDK and its
  # dependencies never reach the offline playwright service. Needs the
  # internet, so it is also on the default network.
  browserstack:
    extends:
      service: playwright
    image: hale-test/browserstack
    profiles: ["browserstack"]
    # The SDK downloads the BrowserStack Local binary into $HOME and runs it.
    # The /tmp tmpfs is noexec, so $HOME is a tmpfs of its own that allows it.
    # The SDK also writes setup files into its working directory, so the
    # entrypoint runs it from a copy of tests/e2e in /hale/browserstack-run.
    tmpfs:
      - /home/browserstack:exec,mode=1777
      - /hale/browserstack-run:mode=1777
    volumes:
      # The SDK's logs, through the copy's log/ link.
      - ./tests/e2e/log:/hale/tests/e2e/log
      # The helper binary the SDK downloads into ~/.browserstack, kept between
      # runs so it is not downloaded again into the tmpfs every time.
      - ./tests/e2e/.stack/browserstack:/home/browserstack/.browserstack
    environment:
      HOME: /home/browserstack
      # Report and results beside the local run's, not over them.
      E2E_OUTPUT_DIR: ./output/browserstack
      # From the environment or the repo root .env, which compose reads.
      BROWSERSTACK_USERNAME: ${BROWSERSTACK_USERNAME:-}
      BROWSERSTACK_ACCESS_KEY: ${BROWSERSTACK_ACCESS_KEY:-}
    networks:
      - default
      - e2e

networks:
  # Joins the playwright container to nginx and nothing else. internal: no
  # route to the host or the internet, so a compromised npm package in the
  # image has nowhere to send anything.
  e2e:
    internal: true

volumes:
  # WordPress core, plugins and themes, copied from the image on first start
  # and shared with nginx. Scoped to this project; removed by `down -v`.
  wpcore:
