; PHP-FPM pool for the readiness probe only - local variant.
;
; Identical to healthz.conf except that it listens on every address, because
; locally nginx runs in its own container (see www.local.conf). The reasoning
; for a separate pool is in healthz.conf.
[healthz]

listen = 9001

pm = static
pm.max_children = 2
pm.max_requests = 10000

request_terminate_timeout = 10
catch_workers_output = yes
decorate_workers_output = no
