; PHP settings for the wptools sidecar (wptools.dockerfile), installed as
; /etc/php84/conf.d/zz-hale.ini. The sidecar does not mount the hale-php-config
; ConfigMap the wordpress container reads, so without this file it runs
; Alpine's defaults (memory_limit = 128M, upload progress on).
;
; The same values as the wordpress container (opt/php/www.conf for PHP-FPM,
; helm_deploy/wordpress/templates/php-config.yaml for its CLI), for the PHP
; out-of-memory and stale global state advisories (GHSA-w8hw-w9fx-j79w,
; GHSA-6wmf-4rv5-p3rp). wp-cli takes no request bodies, so the size and upload
; settings only keep the two containers alike.

; No PHP memory limit: the container memory limit is the boundary.
memory_limit = -1

upload_max_filesize = 30M
post_max_size = 32M

; PHP_INI_PERDIR, so it has to be set in an ini file - ini_set() cannot change it.
session.upload_progress.enabled = Off
