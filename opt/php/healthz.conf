; PHP-FPM pool for the readiness probe only.
;
; nginx's /healthz (port 8090) is the only readiness probe in the pod. It used
; to share the [www] pool, whose ten workers also serve the site. When slow,
; uncached traffic occupied all ten, the probe queued behind it, failed for 30s
; and Kubernetes pulled a pod that was slow but still serving - moving its
; load onto the remaining pods, which then saturated the same way.
;
; A separate pool keeps the probe answering while [www] is busy. It still
; proves what the probe is meant to prove: both pools are children of the same
; php-fpm master, so a dead or wedged master fails this pool too, and
; healthz.php still checks the webroot holds a readable WordPress.
;
; Only /healthz uses this pool. /healthz/deep, /fpm-ping and /fpm-status stay
; on [www] - they report on the pool that serves the site.
[healthz]

; Loopback only, like [www]: reachable by nginx in this pod, nothing else.
listen = '127.0.0.1:9001'

; healthz.php reads four files and a version string - no WordPress boot, no
; database. Two workers so one slow disk read cannot fail the probe.
pm = static
pm.max_children = 2
pm.max_requests = 10000

request_terminate_timeout = 10
catch_workers_output = yes
decorate_workers_output = no
