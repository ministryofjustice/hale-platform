# Env vars shared by every service that talks to the firewall / page cache.
# Merged into each service's environment with `<<: *firewall-pagecache-env`.
x-firewall-pagecache-env: &firewall-pagecache-env
  FIREWALL_ENABLED: ${FIREWALL_ENABLED:-false}
  PAGECACHE_ENABLED: ${PAGECACHE_ENABLED:-true}
  REDIS_SSL: "false"

services:
  nginx:
    container_name: nginx
    platform: linux/arm64
    build:
      context: .
      dockerfile: nginx.local.dockerfile
      target: nginx
    ports:
      - 8080:8080
      - 443:443
    volumes:
      # WP core lives in the shared wpcore volume (fast, native to the Docker
      # VM); only wp-content is bind-mounted from the host so edits to themes,
      # plugins and uploads are picked up. Core is populated into the volume
      # by the wordpress container entrypoint on first start.
      - wpcore:/var/www/html
      - ./wordpress/wp-content:/var/www/html/wp-content
      - ./dev:/mnt/dev
      - ./opt/nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf
      - ./opt/nginx/localwordpress.conf:/usr/local/openresty/nginx/conf/conf.d/localwordpress.conf
      - ./opt/lua/firewall:/usr/local/openresty/nginx/lua/firewall
      - ./opt/lua/pagecache:/usr/local/openresty/nginx/lua/pagecache
      - ./bin/certs:/etc/nginx/certs/self-signed/
    depends_on:
      - wordpress
      - mariadb
    environment:
      <<: *firewall-pagecache-env
      VIRTUAL_HOST: hale.docker
      VIRTUAL_PORT: 443
  mariadb:
    container_name: mariadb
    platform: linux/arm64
    image: mariadb:10.11
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      SERVICE_NAME: mariadb
      SERVICE_TAGS: local
      VIRTUAL_HOST: mariadb.docker
    volumes:
      - database:/var/lib/mysql
  wordpress:
    container_name: wordpress
    platform: linux/arm64
    build:
      context: .
      dockerfile: wordpress.local.dockerfile
    volumes:
      - wpcore:/var/www/html
      - ./wordpress/wp-content:/var/www/html/wp-content
      - ./dev:/mnt/dev
      - ./opt/scripts:/opt/scripts
      - ./opt/php/php-local.ini:/usr/local/etc/php/conf.d/zz-local.ini
    depends_on:
      - mariadb
    env_file:
      - .env
    environment:
      <<: *firewall-pagecache-env
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_ADMIN_USER: admin
      WORDPRESS_ADMIN_PASSWORD: wordpress
      WORDPRESS_ADMIN_EMAIL: "wordpress@hale.docker"
      WP_ENVIRONMENT_TYPE: local
      S3_UPLOADS_USE_LOCAL: "true"
      S3_UPLOADS_USE_INSTANCE_PROFILE: "false"
      S3_UPLOADS_REGION: ""
      S3_UPLOADS_BUCKET: ""
      S3_UPLOADS_BUCKET_URL: ""
      S3_UPLOADS_OBJECT_ACL: ""
      CLOUDFRONT_DISTRIBUTION_ID: ""
      AUTH0_ENV_CLIENT_ID: ""
      AUTH0_ENV_CLIENT_SECRET: ""
      AUTH0_ENV_DOMAIN: ""
      SERVER_NAME: "hale.docker"
      PHP_DSN: "" # Sentry constant (not used locally)
      WP_SENTRY_ENV: ""
      ACF_PRO_LICENSE: ""
      NGINX_INTERNAL_URL: "https://nginx"
  redis:
    image: redis:7-alpine
    profiles:
    - firewall
    - pagecache
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis:/data
  redis-insight:
    image: redis/redisinsight:3.4
    profiles:
    - firewall
    - pagecache
    environment:
      VIRTUAL_PORT: 5540
      VIRTUAL_HOST: redis-insight.docker
      RI_ACCEPT_TERMS_AND_CONDITIONS: true
      RI_REDIS_HOST: redis
volumes:
  database:
    driver: local
  redis:
    driver: local
  # WordPress core files, shared between nginx and wordpress containers.
  # Removed by bin/local-build.sh on rebuild so a new image repopulates core.
  wpcore:
    name: hale-platform_wpcore
    driver: local
