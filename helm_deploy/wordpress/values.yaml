## Default values for WordPress Multisite installation.
## This is a YAML-formatted file.
##
## This file holds defaults shared by every environment. Anything that differs
## between environments lives in values-<env>.yaml and is layered on top:
##
##   helm upgrade wordpress helm_deploy/wordpress \
##     --values helm_deploy/wordpress/values.yaml \
##     --values helm_deploy/wordpress/values-prod.yaml
##
## Templates must never branch on the environment name. If a template needs to
## behave differently somewhere, add a value here and set it in the overlay -
## that keeps "what is different about prod" answerable by reading one file.
##
## Empty strings are populated by --set from GitHub Actions at deploy time.

## @param root domain
## Set per environment in values-<env>.yaml.
##
domain: ""

## @param NGINX config
##
nginx:
  image:
    repository: ""
    imagePullPolicy: Always
    ports:
      containerPort: 8080
      # PHP-FPM health/metrics listener (/fpm-ping, /fpm-status). Internal only:
      # the ingress routes containerPort above and never this one.
      statusPort: 8090

  # Readiness probing. Off in dev/demo, which are single-pod and where a failing
  # probe just removes the only backend.
  probes:
    enabled: false

  # Apply container level resource allocation. Overridden in values-prod.yaml.
  resources:
    limits:
      cpu: "1000m"
      memory: "2000Mi"
    requests:
      cpu: "40m"
      memory: "50Mi"

## @param Wordpress specific paramaters
##
wp:
  image:
    repository: ""
    imagePullPolicy: Always
    ports:
      containerPort: 9000

  # Startup and readiness probing. See nginx.probes above.
  probes:
    enabled: false

  # Apply container level resource allocation. Overridden in values-prod.yaml.
  resources:
    limits:
      cpu: "1000m"
      memory: "2000Mi"
    requests:
      cpu: "100m"
      memory: "600Mi"

## @param wp-tools database tooling sidecar
##
## The hardened WordPress image ships no mysql client, so `wp db` subcommands
## run in this sidecar instead:
##   kubectl exec <pod> -c wp-tools -- wp db query "SELECT ..."
## It sits idle with no listening service, so requests are kept minimal.
##
## Sized identically in every environment - it does no work until someone execs
## into it, so there is nothing for an environment to scale.
##
wptools:
  image:
    repository: ""
    imagePullPolicy: Always

  resources:
    limits:
      cpu: "500m"
      memory: "256Mi"
    requests:
      cpu: "10m"
      memory: "32Mi"

## WordPress Autoscaling configuration
## ref: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/y
## Set min/max thresholds in number of pods run based on CPU can memory.
## minReplicas/maxReplicas are set per environment in values-<env>.yaml.
autoscaling:
  enabled: true
  targetCPU: 70
  targetMemory: 75

## @param Manage replica count
## Default settings when HPA is not turned on. Set per environment.
##
replicaCount: 1

## @param Deploymemt strategy config
##
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

## @param Turn on/off cron tasks
##
cron:
  feedparser:
    enabled: false
  wpK8sCron:
    enabled: true

## @param Uptime availability monitor
##
## Ad hoc utility pod. Deployed scaled to zero so it costs nothing at rest -
## spin it up with "make uptime-up", exec in with "make uptime-shell", and
## shut it down again with "make uptime-down".
##
## The image always comes from the prod namespace's ECR repo, defined in
## cloud-platform-environments at
## hale-platform-prod/resources/ecr-uptime-availability-monitor.tf, and is built
## and pushed by the ministryofjustice/uptime-availability-monitor repo. There is
## no per-namespace repo: the registry is account wide, so any hale-platform
## namespace can pull the same prod image.
uptime:
  # Set false in an overlay to skip the monitor in that environment.
  enabled: true

  image:
    repository: 754256621582.dkr.ecr.eu-west-2.amazonaws.com/jotw-content-devs/hale-platform-prod-uptime-availability-monitor-ecr:latest
    imagePullPolicy: Always

  # Scaled up on demand, so a helm release must never reset it to 1.
  replicaCount: 0

  # URL list mounted at /etc/uptime/urls.txt in the pod. The first entry is the
  # default target: bare "uptime monitor" checks only it. Pass
  # "-f /etc/uptime/urls.txt" (or pick 'a' in the menu) to check every URL.
  urls:
    - https://websitebuilder.service.justice.gov.uk
    - https://dev.websitebuilder.service.justice.gov.uk
    - https://demo.websitebuilder.service.justice.gov.uk
    - https://staging.websitebuilder.service.justice.gov.uk
    - https://www.justice.gov.uk

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

## @param Non-secret env variables
##
## envtype names the environment and is set in values-<env>.yaml. It is the
## chart's identity value: namespaces, service accounts and WAF tags are built
## from it. Templates use it to *name* things, never to decide behaviour.
##
configmap:
  servername: ""
  envtype: ""
  s3useprofile: "true"
  sentrydns: ""
  firewall:
    enabled: "true"

## @param secrets passed in via GitActions
##
secrets:
  enabled: true
  wpdbuser: ""
  wpdbhost: ""
  wpdbname: ""
  wpdbpassword: ""
  wpadminemail: ""
  wpadminuser: ""
  wpadminpassword: ""
  wpauthkey: ""
  wpauthsalt: ""
  wploggedinkey: ""
  wploggedinsalt: ""
  wpnoncekey: ""
  wpnoncesalt: ""
  wpsecureauthkey: ""
  wpsecureauthsalt: ""
  s3uploadsbucket: ""
  s3uploadsbucketurl: ""
  s3uploadsobjectacl: ""
  s3uploadsregion: ""
  cloudfrontdistributionid: ""
  wbconfig: ""
  acftoken: ""
  auth0envclientid: ""
  auth0envclientsecret: ""
  auth0envdomain: ""
  redisauth: ""
  redishost: ""

## @param Toggle alerts on/off
##
alertSecrets:
  enabled: true
  slackWebhookUrl: ""

## @param Manage traffic/domains via NGINX ingress
##
ingress:
  enabled: true
  metadata:
    annotations:
      setidentifier: ""

  # TLS for the environment's own domain. Non-prod environments serve a single
  # hostname off one cert; prod leaves certName empty because every hostname it
  # serves - its own included - is listed under "hosts" below with its own cert.
  defaultHost:
    certName: ""

  # Additional hostnames served by this environment, each with its own cert.
  # Only prod has any: see values-prod.yaml.
  hosts: []

  # www.justice.gov.uk canary Ingress and its dedicated Service. Prod only.
  justiceCanary:
    enabled: false
