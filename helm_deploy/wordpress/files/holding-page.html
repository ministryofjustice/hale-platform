<!DOCTYPE html>
<html lang="en">
	<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Error, service unavailable</title>
	<style>
		main {
			max-width: 1000px;
			margin: 1rem auto;
			font-family: sans-serif;
			font-size: 1.1rem;
		}
		p {
			max-width: 700px;
		}
	</style>
	<!--
		THIS PAGE SHOULD NOT USE SINGLE QUOTES OR DOLLAR SIGNS IN CODE
		They will be converted to their HTML code equivalents

		Site-specific configuration used to customise the holding page.

		Each object represents a website that may display the holding page.

		Properties:
		- title
			The organisation name displayed in the page heading.
			"Thank you for visiting ..." - use "the" if needed

		- url
			The site's hostname, without the protocol.
			For example: ccrc.gov.uk

			The current hostname is matched against this value and its
			www-prefixed equivalent.

		- extraContent
			Optional HTML content inserted into the page. This can be plain text
			or HTML such as links. The content is rendered using innerHTML,
			allowing organisation-specific messages to be displayed.

			DO NOT USE SINGLE QUOTES!!!

			Use an escape character (\) if quotes within quotes is needed.

		Example:
			If the current hostname is ccrc.gov.uk or www.ccrc.gov.uk,
			the holding page will display "CCRC" as the site name and
			show a link to the CCRC careers site.
	-->
	<script>
		const hostname = window.location.hostname;
		const sites = [
			{
				title: "CCRC",
				url: "ccrc.gov.uk",
				extraContent: "For careers, please visit <a href=\"https://careers.ccrc.gov.uk/\">The CCRC vacancies site</a>.",
			},
		];	
		const site = sites.find(site =>
			hostname === site.url ||
			hostname === "www." + site.url
		);
	</script>
	</head>
	<body>
		<header>
			
		</header>
		<main>
			<h1>Thank you for visiting <span id="site-name">our website</span></h1>
			<p>We&rsquo;re carrying out essential maintenance and improvements. The website is temporarily unavailable while this work is completed.</p>
			<p>We apologise for any inconvenience and appreciate your patience.</p>
			<p id="extra"></p>
		</main>
		<script>
			if (site) {
				const siteName = document.getElementById("site-name");
				const extra = document.getElementById("extra");
				if (site.title) siteName.textContent = site.title;
				if (site.extraContent) extra.innerHTML = site.extraContent;
			}
		</script>
	</body>
</html>
