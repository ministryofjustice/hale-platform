## Demonstration environment overlay.
## Layered on top of values.yaml - only values that differ from the shared
## defaults belong here.

domain: demo.websitebuilder.service.justice.gov.uk

configmap:
  envtype: demo

## Same shape as the other environments: enough pods to roll and to scale
## without a gap in service.
replicaCount: 2

autoscaling:
  minReplicas: 2
  maxReplicas: 6

ingress:
  defaultHost:
    certName: websitebuilder-demo-cert
