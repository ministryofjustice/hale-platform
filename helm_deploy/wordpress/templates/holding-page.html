<!DOCTYPE html>
<html lang="en">
	<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Error, service unavailable</title>
	<script defer>
		const url = window.location.href;
		const sites = [
		{
			title: 'CCRC',
			url: 'websitebuilder.service.justice.gov.uk/ccrc',
			extraContent: '<p>For careers, please visit <a href="https://careers.ccrc.gov.uk/">The CCRC vacancies site</a>.</p>',
		},
		{
			title: 'the Prison and Probation Jobs website',
			url: 'websitebuilder.service.justice.gov.uk/ppj',
			extraContent: '<p>For job listings, please go to <a href="https://jobs.justice.gov.uk/careers/SearchJobs">The Justice Jobs website</a>.</p>',
		},
		];
		const site = sites.find(site => url.includes(site.url));

		if (site) {
			const siteName = document.getElementById("site-name");
			const extra = document.getElementById("extra");
			siteName.innerHTML = site.title;
			extra.innerHTML = site.extraContent;
		}
	</script>
	</head>
	<body>
	<main style="max-width: 1000px;margin: 1rem auto;font-family: sans-serif;font-size: 1.2rem;">
		<h1 id="title">Thank you for visiting <span id="site-name">our website</span></h1>
		<p>We&rsquo;re carrying out essential maintenance and improvements. The website is temporarily unavailable while this work is completed.</p>
		<p>We apologise for any inconvenience and appreciate your patience.</p>
		<p id="extra"></p>
	</main>
	</body>
</html>
