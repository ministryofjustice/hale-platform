apiVersion: v1
kind: ConfigMap
metadata:
  name: hale-wp-config-{{ .Release.Revision }}
data:
  WP_ENVIRONMENT_TYPE: {{ .Values.configmap.envtype }}
  SERVER_NAME: {{ .Values.domain }}
  ENV_TYPE: {{ .Values.configmap.envtype }}
  S3_UPLOADS_USE_INSTANCE_PROFILE: {{ .Values.configmap.s3useprofile | quote }}
  PHP_DSN: {{ .Values.configmap.sentrydns }}
  FIREWALL_ENABLED: {{ .Values.configmap.firewall.enabled | quote }}
  PAGECACHE_ENABLED: {{ .Values.configmap.pagecache.enabled | quote }}
  PAGECACHE_TTL: {{ .Values.configmap.pagecache.ttl | quote }}
  PAGECACHE_DB: {{ .Values.configmap.pagecache.db | quote }}
  # Commit SHA this image was built from. Consumed by config.sh -> wp-config
  # constant APP_RELEASE -> hale-components inc/asset-cdn.php, which uses it to
  # build release-scoped CDN asset URLs.
  APP_RELEASE: {{ .Values.configmap.release | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hale-nginx-config-{{ .Release.Revision }}
data:
  FIREWALL_ENABLED: {{ .Values.configmap.firewall.enabled | quote }}
  PAGECACHE_ENABLED: {{ .Values.configmap.pagecache.enabled | quote }}
  PAGECACHE_TTL: {{ .Values.configmap.pagecache.ttl | quote }}
  PAGECACHE_DB: {{ .Values.configmap.pagecache.db | quote }}
  PAGECACHE_MAX_BYTES: {{ .Values.configmap.pagecache.maxbytes | quote }}
