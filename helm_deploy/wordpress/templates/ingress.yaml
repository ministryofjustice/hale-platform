{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hale-platform-ingress
  annotations:
    external-dns.alpha.kubernetes.io/set-identifier: {{ .Values.ingress.metadata.annotations.setidentifier }}
    external-dns.alpha.kubernetes.io/aws-weight: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      {{- /*
      ingress-nginx renders this whole snippet as ONE single-quoted nginx
      parameter: modsecurity_rules '...'. Two limits follow from that:
        - No single quote anywhere in the rendered text, msg values included.
          A quote ends the parameter early.
        - The rendered text must stay under 4096 bytes, the longest parameter
          nginx accepts. Over it, the admission webhook rejects the Ingress with
          "too long parameter, probably missing terminating ' character".
      So every comment in this snippet is a Helm comment like this one, which is
      stripped at render time and costs nothing. Do not use # comments here.
      */}}
      SecRuleEngine On
      SecDefaultAction 
        "phase:2,\
        pass,\
        log,\
        tag:github_team=hale-platform,\
        tag:environment=hale-platform-wb-{{ .Values.configmap.envtype }}"

      {{- /*
      Block every request whose Content-Type mentions multipart, whatever the
      method or letter case. REQUEST_HEADERS:Content-Type checks every
      Content-Type header, so sending two does not get around it.
      This must stay above rule 1001 so it applies regardless of the WB_CONFIG cookie.
      Phase 1 rejects on the headers alone, before the body is read or parsed.
      */}}
      SecRule REQUEST_HEADERS:Content-Type "@contains multipart" \
        "id:300150,\
        phase:1,\
        log,\
        deny,\
        status:403,\
        t:none,t:lowercase,\
        ctl:ruleEngine=On,\
        msg:multipart-request-blocked,\
        tag:github_team=hale-platform,\
        tag:environment=hale-platform-wb-{{ .Values.configmap.envtype }}"

      {{- /* Set WAF Config for Authenticated Users */}}
      SecRule REQUEST_HEADERS:Cookie "@contains WB_CONFIG={{ .Values.secrets.wbconfig }}"
        "id:1001,\
        phase:1,\
        allow,\
        nolog,\
        tag:github_team=hale-platform,\
        tag:environment=hale-platform-{{ .Values.configmap.envtype }}-auth,\
        ctl:ruleEngine=DetectionOnly"
      {{- /* Exclude posthog cookie */}}
      SecRuleUpdateTargetById 942290 "!REQUEST_COOKIES:/^ph_phc_.*_posthog$/"

      {{- /* --- www.justice.gov.uk only rules --- */}}

      {{- /* Block POST requests on www.justice.gov.uk */}}
      SecRule REQUEST_HEADERS:Host "@rx (?i)^www\.justice\.gov\.uk(?::\d+)?$" \
        "id:300140,\
        phase:1,\
        log,\
        deny,\
        t:none,\
        tag:github_team=hale-platform,\
        tag:environment=hale-platform-wb-{{ .Values.configmap.envtype }},\
        chain"
      SecRule REQUEST_METHOD "@streq POST" "t:none"

      {{- /*
      Allow only specific parameters on search requests,
      this applies to all users, regardless of logged in state.
      */}}
      SecRule REQUEST_HEADERS:Host "@rx (?i)^www\.justice\.gov\.uk(?::\d+)?$" \
        "id:100100,\
        phase:1,\
        deny,\
        log,\
        t:none,\
        tag:github_team=hale-platform,\
        tag:environment=hale-platform-wb-{{ .Values.configmap.envtype }},\
        chain"
      SecRule REQUEST_URI "@rx ^/search(?:$|/|\?)" "chain"
      SecRule ARGS_GET_NAMES "!@rx ^(?:s|section|organisation|audience|type|parent|post_types|redirected|orderby)(?:\[[^\]]*\])?$" ""

      {{- /*
      Target spam search URIs, these are URIs that:
      - the request starts with /search/
      - the path contains repeated pagination segments, e.g. /page/3/page/2/page/5/...
        A legitimate paginated search only ever has a single /page/N segment.
      - match the decoded path (REQUEST_FILENAME excludes the query string) so that
        URL-encoded slashes (%2Fpage%2F3...) are also caught.
      Return a 403 status code for these requests to explicitly block spammy searches.
      This rejects spam search traffic at the WAF level instead of shadow-banning it.
      */}}
      SecRule REQUEST_HEADERS:Host "@rx (?i)^www\.justice\.gov\.uk(?::\d+)?$" \
        "id:10300,\
        phase:1,\
        deny,\
        nolog,\
        status:403,\
        t:none,\
        tag:github_team=hale-platform,\
        tag:environment=hale-platform-wb-{{ .Values.configmap.envtype }},\
        chain"
      SecRule REQUEST_FILENAME "@rx ^/search/.*/page/\d+/page/\d+" "t:none,t:urlDecodeUni"

      {{- /*
      301 redirect requests (NOT under /search) that include ANY query string
      to the same path without the query.
      - Declare the 301 redirect
      - Only apply to www.justice.gov.uk
      - Exclude /search* from this behavior
      - Only do this when there IS a query string (i.e., at least one GET param)
      - Require that at least one param name is NOT in the allowlist
        (requests with only s, parent, ver, auth0, code, state params pass through)
      */}}
      SecRule REQUEST_URI "@rx ^/([^?]*)" \
        "id:300130,\
        phase:1,\
        log,\
        redirect:/%{TX.1},\
        status:301,\
        capture,\
        t:none,\
        tag:github_team=hale-platform,\
        tag:environment=hale-platform-wb-{{ .Values.configmap.envtype }},\
        chain"
      SecRule REQUEST_HEADERS:Host "@rx (?i)^www\.justice\.gov\.uk(?::\d+)?$" "t:none,chain"
      SecRule REQUEST_URI "!@rx ^/search(?:$|/|\?)" "t:none,chain"
      SecRule &ARGS_GET_NAMES "@gt 0" "t:none,chain"
      SecRule ARGS_GET_NAMES "!@rx ^(?:s|parent|ver|auth0|code|state)(?:\[[^\]]*\])?$" "t:none"
    nginx.ingress.kubernetes.io/server-snippet: |
      {{- if .Values.ingress.holdingPage.enabled }}
      {{- /*
      Holding page: every request outside /.well-known/ is answered by the
      ingress itself and never reaches WordPress. It sits first in the snippet,
      so it also takes precedence over the host redirects and /bold below.
      /.well-known/ is left alone for security.txt and cert-manager ACME
      challenges. The HTML is one single-quoted nginx string, so it must not
      contain a single quote, and every line must stay indented under the
      server-snippet key or the YAML block ends early.
      */}}
      if ($uri !~ ^/\.well-known/) {
        rewrite ^ /__holding-page last;
      }
      location = /__holding-page {
        internal;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 200 '<!DOCTYPE html>
        <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Error, service unavailable</title>
          </head>
          <body>
            <h1>Thank you for visiting our website</h1>
            <p>We&#39;re carrying out essential maintenance and improvements. The website is temporarily unavailable while this work is completed.</p>
            <p>We apologise for any inconvenience and appreciate your patience.</p>
          </body>
        </html>
        ';
      }
      {{- end }}
      location = /.well-known/security.txt {
        auth_basic off;
        return 301 https://raw.githubusercontent.com/ministryofjustice/security-guidance/main/contact/vulnerability-disclosure-security.txt;
      }
      location /bold {
        if ($host = 'hale-platform-prod.apps.live.cloud-platform.service.justice.gov.uk') {
          return 301 https://bold.websitebuilder.service.justice.gov.uk;
        }
      }
      if ($host = 'victimscode.org.uk') {
        return 301 https://victimandwitnessinformation.org.uk/your-rights/as-a-victim;
      }
      if ($host = 'cym.victimscode.org.uk') {
        return 301 https://cym.victimandwitnessinformation.org.uk/your-rights/as-a-victim;
      }
      if ($host = 'seewhatsontheinside.com') {
        return 301 https://newfuturesnetwork.gov.uk;
      }
      if ($host = 'www.seewhatsontheinside.com') {
        return 301 https://newfuturesnetwork.gov.uk;
      }
      if ($host = 'seewhatsontheinside.co.uk') {
        return 301 https://newfuturesnetwork.gov.uk;
      }
      if ($host = 'www.seewhatsontheinside.co.uk') {
        return 301 https://newfuturesnetwork.gov.uk;
      }
      if ($host = 'advance-into-justice.service.justice.gov.uk') {
        return 301 https://prisonandprobationjobs.gov.uk/roles-at-hmpps/jobs-for-veterans;
      }
      if ($host = 'www.advance-into-justice.service.justice.gov.uk') {
        return 301 https://prisonandprobationjobs.gov.uk/roles-at-hmpps/jobs-for-veterans;
      }
      if ($host = 'iapondeathsincustody.org') {
        return 301 https://iapdeathsincustody.independent.gov.uk;
      }
      if ($host = 'www.iapondeathsincustody.org') {
        return 301 https://iapdeathsincustody.independent.gov.uk;
      }
      if ($host = 'brookhouseinquiry.org.uk') {
        return 301 https://webarchive.nationalarchives.gov.uk/ukgwa/20241002135959/https://brookhouseinquiry.org.uk/;
      }
      if ($host = 'www.brookhouseinquiry.org.uk') {
        return 301 https://webarchive.nationalarchives.gov.uk/ukgwa/20241002135959/https://brookhouseinquiry.org.uk/;
      }
spec:
  ingressClassName: modsec
  tls:
{{- if .Values.ingress.defaultHost.certName }}
  - hosts:
    - {{ .Values.domain }}
    secretName: {{ .Values.ingress.defaultHost.certName }}
{{- end }}
{{- range .Values.ingress.hosts }}
  - hosts:
    - {{ .name }}
    secretName: {{ .certName }}
{{- end }}
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: wordpress
                port:
                  number: 8080
  {{- range .Values.ingress.hosts }}
    - host: {{ .name }}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: wordpress
                port:
                  number: 8080
  {{- end }}
{{- end }}
