{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hale-platform-ingress
  annotations:
    external-dns.alpha.kubernetes.io/set-identifier: {{ .Values.ingress.metadata.annotations.setidentifier }}
    external-dns.alpha.kubernetes.io/aws-weight: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      {{- /*
      ingress-nginx renders this whole snippet as ONE single-quoted nginx
      parameter: modsecurity_rules '...'. Two limits follow from that:
        - No single quote anywhere in the rendered text, msg values included.
          A quote ends the parameter early.
        - The rendered text must stay under 4096 bytes, the longest parameter
          nginx accepts. Over it, the admission webhook rejects the Ingress with
          "too long parameter, probably missing terminating ' character".
      So every comment in this snippet is a Helm comment like this one, which is
      stripped at render time and costs nothing. Do not use # comments here.
      */}}
      SecRuleEngine On
      SecDefaultAction 
        "phase:2,\
        pass,\
        log,\
        tag:github_team=hale-platform,\
        tag:environment=hale-platform-wb-{{ .Values.configmap.envtype }}"

      {{- /* Set WAF Config for Authenticated Users */}}
      SecRule REQUEST_HEADERS:Cookie "@contains WB_CONFIG={{ .Values.secrets.wbconfig }}"
        "id:1001,\
        phase:1,\
        allow,\
        nolog,\
        tag:github_team=hale-platform,\
        tag:environment=hale-platform-{{ .Values.configmap.envtype }}-auth,\
        ctl:ruleEngine=DetectionOnly"
      {{- /* Exclude posthog cookie */}}
      SecRuleUpdateTargetById 942290 "!REQUEST_COOKIES:/^ph_phc_.*_posthog$/"

      {{- /* --- www.justice.gov.uk only rules --- */}}

      {{- /* Block POST requests on www.justice.gov.uk */}}
      SecRule REQUEST_HEADERS:Host "@rx (?i)^www\.justice\.gov\.uk(?::\d+)?$" \
        "id:300140,\
        phase:1,\
        log,\
        deny,\
        t:none,\
        tag:github_team=hale-platform,\
        tag:environment=hale-platform-wb-{{ .Values.configmap.envtype }},\
        chain"
      SecRule REQUEST_METHOD "@streq POST" "t:none"

      {{- /*
      Allow only specific parameters on search requests,
      this applies to all users, regardless of logged in state.
      */}}
      SecRule REQUEST_HEADERS:Host "@rx (?i)^www\.justice\.gov\.uk(?::\d+)?$" \
        "id:100100,\
        phase:1,\
        deny,\
        log,\
        t:none,\
        tag:github_team=hale-platform,\
        tag:environment=hale-platform-wb-{{ .Values.configmap.envtype }},\
        chain"
      SecRule REQUEST_URI "@rx ^/search(?:$|/|\?)" "chain"
      SecRule ARGS_GET_NAMES "!@rx ^(?:s|section|organisation|audience|type|parent|post_types|redirected|orderby)(?:\[[^\]]*\])?$" ""

      {{- /*
      Target spam search URIs, these are URIs that:
      - the request starts with /search/
      - the path contains repeated pagination segments, e.g. /page/3/page/2/page/5/...
        A legitimate paginated search only ever has a single /page/N segment.
      - match the decoded path (REQUEST_FILENAME excludes the query string) so that
        URL-encoded slashes (%2Fpage%2F3...) are also caught.
      Return a 403 status code for these requests to explicitly block spammy searches.
      This rejects spam search traffic at the WAF level instead of shadow-banning it.
      */}}
      SecRule REQUEST_HEADERS:Host "@rx (?i)^www\.justice\.gov\.uk(?::\d+)?$" \
        "id:10300,\
        phase:1,\
        deny,\
        nolog,\
        status:403,\
        t:none,\
        tag:github_team=hale-platform,\
        tag:environment=hale-platform-wb-{{ .Values.configmap.envtype }},\
        chain"
      SecRule REQUEST_FILENAME "@rx ^/search/.*/page/\d+/page/\d+" "t:none,t:urlDecodeUni"

      {{- /*
      301 redirect requests (NOT under /search) that include ANY query string
      to the same path without the query.
      - Declare the 301 redirect
      - Only apply to www.justice.gov.uk
      - Exclude /search* from this behavior
      - Only do this when there IS a query string (i.e., at least one GET param)
      - Require that at least one param name is NOT in the allowlist
        (requests with only s, parent, ver, auth0, code, state, error and
        error_description params pass through. code, state, error and
        error_description are Auth0 returning to the login page; auth0 was the
        callback parameter of the 4.x Auth0 plugin)
      */}}
      SecRule REQUEST_URI "@rx ^/([^?]*)" \
        "id:300130,\
        phase:1,\
        log,\
        redirect:/%{TX.1},\
        status:301,\
        capture,\
        t:none,\
        tag:github_team=hale-platform,\
        tag:environment=hale-platform-wb-{{ .Values.configmap.envtype }},\
        chain"
      SecRule REQUEST_HEADERS:Host "@rx (?i)^www\.justice\.gov\.uk(?::\d+)?$" "t:none,chain"
      SecRule REQUEST_URI "!@rx ^/search(?:$|/|\?)" "t:none,chain"
      SecRule &ARGS_GET_NAMES "@gt 0" "t:none,chain"
      SecRule ARGS_GET_NAMES "!@rx ^(?:s|parent|ver|auth0|code|state|error|error_description)(?:\[[^\]]*\])?$" "t:none"

    nginx.ingress.kubernetes.io/server-snippet: |
      # ... existing security.txt, /bold and host redirects unchanged ...

      {{- /*
      Holding pages (ingress.holdingPage in values.yaml). Each host behind a
      holding page sets $hale_holding to the internal location serving its
      page: a site's own page for its listed hosts, and with
      holdingPage.enabled the generic page for every other host. /.well-known/
      clears it, so security.txt and ACME challenges still work.
      */}}
      {{- $holding := .Values.ingress.holdingPage }}

      {{- /* Hosts this ingress serves, used to check the values */}}
      {{- $served := list .Values.domain }}
      {{- range .Values.ingress.hosts }}
      {{- $served = append $served .name }}
      {{- end }}

      {{- /* Check every site, and collect the ones that are on */}}
      {{- $sitesOn := dict }}
      {{- range $name, $site := $holding.sites }}
      {{- if not (regexMatch "^[a-z0-9-]+$" $name) }}
      {{- fail (printf "ingress.holdingPage.sites.%s: the name may only use a-z, 0-9 and -" $name) }}
      {{- end }}
      {{- range $site.hosts }}
      {{- if not (has . $served) }}
      {{- fail (printf "ingress.holdingPage.sites.%s: %s is not served by this ingress" $name .) }}
      {{- end }}
      {{- end }}
      {{- if and $site.enabled (not $site.hosts) }}
      {{- fail (printf "ingress.holdingPage.sites.%s is enabled but there is a problem.") }}
      {{- end }}
      {{- if and (or $holding.enabled $site.enabled) $site.hosts }}
      {{- $_ := set $sitesOn $name $site }}
      {{- end }}
      {{- end }}

      {{- /* 302 redirects, only while every host is behind the holding page */}}
      {{- if and $holding.enabled $holding.redirects.enabled }}
      set $hale_holding_redirect '';
      {{- range $i, $redirect := $holding.redirects.hosts }}
      {{- /* existing required / has / regexMatch checks unchanged */}}
      if ($host = '{{ $redirect.host }}') {
        set $hale_holding_redirect '{{ $redirect.to }}';
      }
      {{- end }}
      if ($uri ~ ^/\.well-known/) {
        set $hale_holding_redirect '';
      }
      if ($hale_holding_redirect) {
        return 302 $hale_holding_redirect;
      }
      {{- end }}

      {{- /* Choose the page for this request */}}
      {{- if or $holding.enabled $sitesOn }}
      set $hale_holding '{{ if $holding.enabled }}/__holding-page{{
      {{- range $name, $site := $sitesOn }}
      {{- range $site.hosts }}
      if ($host = '{{ . }}') {
        set $hale_holding /__holding-page-{{ $name }};
      }
      {{- end }}
      {{- end }}
      if ($uri ~ ^/\.well-known/) {
        set $hale_holding '';
      }
      if ($hale_holding) {
        rewrite ^ $hale_holding last;
      }

      {{- /* Generic page, only with the global switch */}}
      {{- if $holding.enabled }}
      location = /__holding-page {
        internal;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "3600" always;
        return 503 '{{ include "hale.holdingPageHtml" (dict "root" l") }}';
      }
      {{- end }}

      {{- /* One location per site that is on */}}
      {{- range $name, $site := $sitesOn }}
      location = /__holding-page-{{ $name }} {
        internal;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "3600" always;
        return 503 '{{ include "hale.holdingPageHtml" (dict "root" $ "path" $site.page) }}';
      }
      {{- end }}
      {{- end }}
spec:
  ingressClassName: modsec-v2
  tls:
{{- if .Values.ingress.defaultHost.certName }}
  - hosts:
    - {{ .Values.domain }}
    secretName: {{ .Values.ingress.defaultHost.certName }}
{{- end }}
{{- range .Values.ingress.hosts }}
  - hosts:
    - {{ .name }}
    secretName: {{ .certName }}
{{- end }}
  rules:
    - host: {{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: wordpress
                port:
                  number: 8080
  {{- range .Values.ingress.hosts }}
    - host: {{ .name }}
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: wordpress
                port:
                  number: 8080
  {{- end }}
{{- end }}
