apiVersion: v1
kind: ConfigMap
metadata:
  name: hale-php-config-{{ .Release.Revision }}
  namespace: hale-platform-{{ .Values.configmap.envtype }}
data:
  wordpress-custom.ini: |-
    upload_max_filesize = 400M
    post_max_size = 512M
    max_execution_time = 600
    max_input_time = 600
    memory_limit = 512M

    ; Stop PHP writing upload progress into session data during multipart POSTs.
    ; This is PHP_INI_PERDIR, so it has to be set here - ini_set() cannot change it.
    session.upload_progress.enabled = Off
