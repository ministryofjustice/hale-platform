## Production environment overlay.
## Layered on top of values.yaml - only values that differ from the shared
## defaults belong here.

domain: websitebuilder.service.justice.gov.uk

configmap:
  envtype: prod

replicaCount: 6

autoscaling:
  minReplicas: 6
  maxReplicas: 18

## More memory per pod than the other environments, and much larger requests so
## the scheduler reserves real capacity rather than letting pods burst into it.
wp:
  probes:
    enabled: true
  resources:
    limits:
      cpu: "1000m"
      memory: "3000Mi"
    requests:
      cpu: "500m"
      memory: "1800Mi"

nginx:
  probes:
    enabled: true
  resources:
    limits:
      cpu: "1000m"
      memory: "3000Mi"
    requests:
      cpu: "100m"
      memory: "200Mi"

## @param Manage traffic/domains via NGINX ingress
##
## Every public hostname the platform serves, each with its own cert. Only prod
## has these: the other environments serve a single hostname off defaultHost.
## defaultHost.certName stays empty here because prod's own domain
## (websitebuilder.service.justice.gov.uk) is already in the list below.
##
## Adding a site to the platform means adding its hostname here - which is why
## this list lives in the prod overlay and not in a file the other environments
## also read.
ingress:
  defaultHost:
    certName: ""

  # www.justice.gov.uk canary Ingress plus its dedicated canary Service.
  justiceCanary:
    enabled: true

  hosts:
